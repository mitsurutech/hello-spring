# **SERVER_PORT wins over this**, because Spring Boot reads the environment before the
# properties file. So the platform setting SERVER_PORT is what decides in a deployment, and
# this is only the default for running it on your own machine.
server.port=8080

# The address the app answers on is injected as ALLOWED_HOSTS by the platform. Spring Boot
# does not check the Host header by default, so nothing here has to use it — unlike Django,
# which refuses an unknown Host outright.
